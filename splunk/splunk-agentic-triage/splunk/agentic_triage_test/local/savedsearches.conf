# Test correlation search for the agentic triage workflow.
# Simulates a Windows / VPN brute-force detectable notable without
# requiring indexed sample data — synthetic rows via makeresults.
#
# Install under:
#   $SPLUNK_HOME/etc/apps/agentic_triage_test/
# Then restart Splunk (or debug/refresh) and enable the search in ES.

[Test - Agentic Triage Notable]
disabled = false
description = Lab correlation search that synthesizes a realistic brute-force login attack and creates a notable for end-to-end testing of the n8n agentic triage workflow. Self-contained via makeresults — no indexed logs required.
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
schedule_window = auto
alert.track = 1
# Splunk alert severity: 1=debug, 2=info, 3=warn, 4=error, 5=severe, 6=fatal
alert.severity = 4
alert.suppress = 0
counttype = number of events
relation = greater than
quantity = 0

# Mark as an ES correlation search that creates notables
action.correlationsearch = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = Test - Agentic Triage Notable
action.correlationsearch.annotations.mitre_attack = T1110.001

action.notable = 1
action.notable.param.rule_title = Brute Force Detected: $dest_user$ from $src_ip$
action.notable.param.rule_description = Synthetic brute-force notable for agentic triage testing. Source $src_ip$ attempted $failed_attempts$ failed logins against user $dest_user$ on $dest_host$ ($dest_ip$) over $attack_window$. Attack type: $attack_type$. First seen $first_seen$, last seen $last_seen$.
action.notable.param.severity = high
action.notable.param.urgency = high
action.notable.param.security_domain = access
action.notable.param.nes_fields = src_ip,dest_ip,dest_user,dest_host,failed_attempts,attack_type
action.notable.param.drilldown_name = Failed logins for $src_ip$ / $dest_user$
action.notable.param.drilldown_search = index=* (src=$src_ip$ OR src_ip=$src_ip$) (user=$dest_user$ OR dest_user=$dest_user$) (action=failure OR result=failed OR EventCode=4625)
action.notable.param.drilldown_earliest_offset = $info_min_time$
action.notable.param.drilldown_latest_offset = $info_max_time$
action.notable.param.next_steps = Investigate via n8n agentic triage workflow; consider locking the account and blocking the source IP
action.notable.param.recommended_actions =
action.notable.param.investigation_type = default

# Risk modifier (required message for ES Content Management validation)
action.risk = 1
action.risk.param._risk_message = Brute-force activity from $src_ip$ targeting $dest_user$ on $dest_host$ ($failed_attempts$ failed attempts, $attack_type$)
action.risk.param._risk_object = src_ip
action.risk.param._risk_object_type = system
action.risk.param._risk_score = 45

# Webhook → n8n agentic triage (built-in Splunk webhook posts first result row under "result")
action.webhook = 1
action.webhook.param.url = http://localhost:5678/webhook/splunk

request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
is_visible = true
realtime_schedule = 0

# Self-contained synthetic brute-force scenario (no indexed data required).
# Builds 12 failed-login rows across ~4 minutes, then aggregates into one
# notable row with enough context for the AI triage agent.
search = | makeresults count=12 \
| streamstats count as attempt_num \
| eval src_ip="203.0.113.87" \
| eval dest_ip="10.0.1.25" \
| eval dest_host="corp-vpn-gw01.internal.example" \
| eval dest_user="jsmith" \
| eval dest="corp-vpn-gw01.internal.example" \
| eval user="jsmith" \
| eval action="failure" \
| eval result="failed_authentication" \
| eval signature="Failed Authentication" \
| eval signature_id="4625" \
| eval sourcetype="WinEventLog:Security" \
| eval app="vpn" \
| eval authentication_method="password" \
| eval vendor_product="Cisco AnyConnect" \
| eval attack_type="password_spray_brute_force" \
| eval reason=case( \
    attempt_num%3=1, "Unknown user name or bad password", \
    attempt_num%3=2, "Account locked out", \
    true(), "Logon failure - unknown reason" \
  ) \
| eval _time=now()-((12-attempt_num)*20) \
| eval raw_event="Failed VPN login: user=".dest_user." src=".src_ip." dest=".dest_host." reason=\"".reason."\" attempt=".attempt_num \
| stats count as failed_attempts, \
        earliest(_time) as first_seen_epoch, \
        latest(_time) as last_seen_epoch, \
        values(reason) as failure_reasons, \
        latest(dest) as dest, \
        latest(user) as user \
        by src_ip, dest_ip, dest_host, dest_user, attack_type, app, vendor_product, signature, signature_id, sourcetype, authentication_method \
| eval first_seen=strftime(first_seen_epoch, "%Y-%m-%d %H:%M:%S %Z") \
| eval last_seen=strftime(last_seen_epoch, "%Y-%m-%d %H:%M:%S %Z") \
| eval attack_window=tostring(last_seen_epoch-first_seen_epoch)." seconds" \
| eval urgency="high" \
| eval severity="high" \
| eval security_domain="access" \
| eval event_id="bf-".md5(src_ip.dest_user.tostring(last_seen_epoch)) \
| eval rule_name="Test - Agentic Triage Notable" \
| eval signature="Possible Brute Force / Password Spray against VPN" \
| eval description="Detected ".failed_attempts." consecutive failed VPN authentications from ".src_ip." against account ".dest_user." on ".dest_host." within ".attack_window.". Failure reasons: ".mvjoin(failure_reasons, "; ").". Consistent with MITRE T1110.001 (Password Guessing)." \
| eval mitre_technique="T1110.001" \
| eval mitre_tactic="Credential Access" \
| eval ioc_summary=src_ip." -> ".dest_user." @ ".dest_host." (" .failed_attempts." failures)" \
| eval recommended_actions="Block or rate-limit src_ip ".src_ip."; reset or lock account ".dest_user."; review VPN auth logs for successful follow-on logins; check other identities targeted from the same source." \
| table _time, event_id, rule_name, signature, description, \
        src_ip, dest_ip, dest_host, dest_user, user, dest, \
        failed_attempts, first_seen, last_seen, attack_window, \
        attack_type, app, vendor_product, authentication_method, \
        signature_id, sourcetype, failure_reasons, \
        mitre_technique, mitre_tactic, security_domain, \
        urgency, severity, ioc_summary, recommended_actions
